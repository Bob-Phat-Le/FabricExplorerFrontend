<!-- MICROSOFT ENTRA ID OAUTH 2.0 CONFIGURATION POPUP MODAL -->
<div id="modalEntraOAuth" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-4xl w-full p-6 space-y-5 my-8">
        <div class="flex items-start justify-between border-b border-slate-100 pb-3">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg shrink-0 border border-indigo-100">
                    <i class="fa-brands fa-microsoft"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-900 leading-tight">Microsoft Entra ID</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Configure an OAuth 2.0 connection to Microsoft Fabric.</p>
                </div>
            </div>
            <button type="button" onclick="closeModal('modalEntraOAuth')" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 space-y-4 text-xs">
                <div class="space-y-1.5">
                    <label class="block font-semibold text-slate-800">Connection Name <span class="text-rose-500">*</span></label>
                    <input type="text" id="oauthConnName" oninput="updateOauthSummaryPanel()" class="w-full text-xs px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="space-y-1.5">
                    <label class="block font-semibold text-slate-800">Workspace ID <span class="text-rose-500">*</span></label>
                    <input type="text" id="oauthWorkspaceId" oninput="handleWsIdInput()" class="w-full text-xs font-mono px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="space-y-1.5">
                    <label class="block font-semibold text-slate-800">OAuth 2.0 Token Endpoint <span class="text-rose-500">*</span></label>
                    <input type="url" id="oauthEndpoint" oninput="updateOauthSummaryPanel()" class="w-full text-xs font-mono px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="space-y-1.5">
                    <label class="block font-semibold text-slate-800">Client ID <span class="text-rose-500">*</span></label>
                    <input type="text" id="oauthClientId" oninput="updateOauthSummaryPanel()" class="w-full text-xs font-mono px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="space-y-1.5">
                    <label class="block font-semibold text-slate-800">Client Secret <span class="text-rose-500" id="oauthSecretRequired">*</span></label>
                    <input type="password" id="oauthClientSecret" autocomplete="new-password" oninput="updateOauthSummaryPanel()" class="w-full text-xs font-mono px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3 text-xs h-fit">
                <h4 class="font-bold text-slate-900 text-xs border-b pb-2">Connection Summary</h4>
                <dl class="space-y-2 text-[11px]">
                    <div><dt class="text-slate-400">Name</dt><dd class="font-bold text-slate-900" id="sumName">Production Fabric</dd></div>
                    <div><dt class="text-slate-400">Workspace</dt><dd class="font-bold text-slate-800" id="sumWsName">Production Analytics</dd></div>
                    <div><dt class="text-slate-400">Authentication</dt><dd class="font-semibold text-slate-800">Entra ID · OAuth 2.0</dd></div>
                </dl>
            </div>
        </div>

        <div class="flex items-center justify-between border-t border-slate-100 pt-4">
            <button type="button" onclick="closeModal('modalEntraOAuth')" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Cancel</button>
            <div class="flex items-center space-x-2">
                <button type="button" id="btnOauthTest" onclick="executeOauthConnectionTest()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-700 bg-white border border-slate-300 hover:bg-slate-50">Test Connection</button>
                <button type="button" id="btnOauthSave" onclick="saveOauthConnectionModal()" class="px-5 py-2 rounded-lg text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700">Save Connection</button>
            </div>
        </div>
    </div>
</div>
